<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Cadastro</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #eef2f7; color: #202938; }
    header { background: #243b6b; color: white; padding: 22px; text-align: center; }
    nav { display: flex; justify-content: center; gap: 22px; padding: 13px; background: #17294c; }
    nav a { color: white; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 680px; margin: 32px auto; padding: 24px; background: white; border-radius: 12px; box-shadow: 0 4px 18px #0001; }
    h2 { margin-top: 0; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input, select { width: 100%; padding: 11px; border: 1px solid #b9c3d0; border-radius: 6px; }
    button { margin-top: 18px; padding: 12px 18px; border: 0; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    #feedback { min-height: 24px; margin-top: 16px; color: #137333; }
    .aluno { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid #e5e7eb; }
    .aluno button { margin: 0; padding: 7px 10px; background: #b42318; }
    .oculto { display: none; }
    footer { text-align: center; color: #667085; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>Sistema de Cadastro</h1>
    <p>Uma aplicação simples para praticar testes automatizados</p>
  </header>

  <nav>
    <a href="#cadastro">Cadastrar</a>
    <a href="#lista">Lista de alunos</a>
  </nav>

  <main>
    <section id="cadastro">
      <h2>Cadastro de aluno</h2>
      <form id="formCadastro">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" placeholder="Digite o nome" required>

        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" placeholder="aluno@email.com" required>

        <label for="curso">Curso</label>
        <select id="curso" name="curso" required>
          <option value="">Selecione um curso</option>
          <option value="Desenvolvimento de Sistemas">Desenvolvimento de Sistemas</option>
          <option value="Mecatrônica">Mecatrônica</option>
          <option value="Eletroeletrônica">Eletroeletrônica</option>
        </select>

        <button type="submit">Cadastrar aluno</button>
      </form>
      <p id="feedback" role="status" aria-live="polite"></p>
    </section>

    <section id="lista">
      <h2>Alunos cadastrados</h2>
      <p id="vazio">Nenhum aluno cadastrado ainda.</p>
      <div id="alunos"></div>
    </section>
  </main>

  <footer>Projeto de demonstração — testes com Playwright</footer>

  <script>
    const form = document.querySelector("#formCadastro");
    const feedback = document.querySelector("#feedback");
    const alunos = document.querySelector("#alunos");
    const vazio = document.querySelector("#vazio");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const nome = document.querySelector("#nome").value.trim();
      const email = document.querySelector("#email").value.trim();
      const curso = document.querySelector("#curso").value;

      if (!nome || !email || !curso) {
        feedback.textContent = "Preencha todos os campos.";
        return;
      }

      const linha = document.createElement("div");
      linha.className = "aluno";

      const dados = document.createElement("span");
      dados.textContent = `${nome} — ${email} — ${curso}`;

      const remover = document.createElement("button");
      remover.type = "button";
      remover.textContent = "Remover";
      remover.setAttribute("aria-label", `Remover ${nome}`);
      remover.addEventListener("click", () => {
        linha.remove();
        vazio.classList.toggle("oculto", alunos.children.length > 0);
      });

      linha.append(dados, remover);
      alunos.appendChild(linha);
      vazio.classList.add("oculto");

      feedback.textContent = "Aluno cadastrado com sucesso!";
      form.reset();
    });
  </script>
</body>
</html>
